[rag]
audience = "staff"
random_seed = 4686065
as_of_date = "2026-11-24"
source_dir = "data/rag/staff/documents"
benchmark_path = "data/rag/staff/benchmark.jsonl"
release_dir = "artifacts/rag/staff/releases"
experiment_name = "staff-rag-experiments"

[chunking]
method = "recursive"
chunk_size = 120
overlap = 20

[embedding]
profile = "mini_lm"
dimension = 384

[embedding.models.mini_lm]
model_id = "sentence-transformers/all-MiniLM-L6-v2"
revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"

[embedding.models.bge_small]
model_id = "BAAI/bge-small-en-v1.5"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"

[retrieval]
mode = "hybrid"
candidate_k = 10
top_k = 5
rrf_k = 60
rerank = false
reranker_model_id = "cross-encoder/ms-marco-MiniLM-L6-v2"
reranker_revision = "233902d"

[promotion]
min_recall_at_k = 0.80
min_mrr = 0.75
max_unauthorized_rate = 0.0

[mlflow]
tracking_uri = "sqlite:///artifacts/mlflow/mlflow.db"
artifact_root = "artifacts/mlflow/files"
