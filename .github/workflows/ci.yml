name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.23"

      - name: Install locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  deployment-config:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build application image from lockfile
        run: docker build --build-arg AI_SUPPORT_GIT_COMMIT=${{ github.sha }} --tag uowd-ai-support:ci .

      - name: Verify non-root image user
        run: test "$(docker image inspect uowd-ai-support:ci --format '{{.Config.User}}')" = "10001:10001"

      - name: Start application image
        run: docker run --detach --name uowd-ai-support-ci --publish 127.0.0.1:18000:8000 uowd-ai-support:ci

      - name: Smoke-test container health
        run: curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:18000/health

      - name: Remove smoke-test container
        if: always()
        run: docker rm --force uowd-ai-support-ci || true
